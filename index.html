<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101b35">
  <meta name="description" content="TimeCraft — offline school timetable and fixture manager">
  <title>TimeCraft</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img src="icon.svg" alt="" class="brand-icon"><div><b>TimeCraft</b><small>School timetable studio</small></div></div>
      <nav id="navigation" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Overview</button>
        <button class="nav-item" data-view="timetable"><span>▦</span> Timetable</button>
        <button class="nav-item" data-view="assignments"><span>✓</span> Assignments & vacancies</button>
        <button class="nav-item" data-view="fixtures"><span>⇄</span> Fixtures</button>
        <button class="nav-item" data-view="teachers"><span>♙</span> Teachers</button>
        <button class="nav-item" data-view="classes"><span>▤</span> Classes</button>
        <button class="nav-item" data-view="subjects"><span>◈</span> Subjects</button>
        <button class="nav-item" data-view="settings"><span>⚙</span> Settings & backup</button>
      </nav>
      <div class="sidebar-foot"><span class="offline-dot"></span> Offline-first workspace</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
        <div><div class="eyebrow" id="crumb">WORKSPACE</div><h1 id="pageTitle">Overview</h1></div>
        <div class="top-actions"><span class="local-pill"><i></i> Local data</span><button class="avatar" title="TimeCraft">TC</button></div>
      </header>
      <section class="content" id="appContent" aria-live="polite"></section>
      <footer>TimeCraft <span>·</span> Developed by Tammarjan <span>·</span> Tammarjan94@gmail.com</footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
